name: TheBitLab local grading preview

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: "Identificativo stabile dell'attivita"
        required: true
        default: "c-base-somma-001"
      assignment_id:
        description: "Identificativo stabile dell'assegnazione"
        required: true
      student_id:
        description: "Identificativo stabile dello studente"
        required: true
      activity_path:
        description: "Path della activity JSON nel repository studente"
        required: true
        default: "assignments/c-base-somma-001/activity.json"
      source_path:
        description: "Path del sorgente da correggere nel repository studente"
        required: true
        default: "assignments/c-base-somma-001/main.c"
      language:
        description: "Linguaggio della consegna"
        required: true
        default: "c"
      thebitlab_ref:
        description: "Branch, tag o commit di TheBitLab da usare per il grading"
        required: true
        default: "main"

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4
        with:
          path: student-work

      - name: Checkout TheBitLab source
        uses: actions/checkout@v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: ${{ inputs.thebitlab_ref }}
          path: thebitlab

      - name: Build grading Docker image
        run: docker build -t thebitlab-assignment-runner -f thebitlab/docker/assignment-runner/Dockerfile thebitlab

      - name: Run deterministic grading
        env:
          ACTIVITY_PATH: ${{ inputs.activity_path }}
          SOURCE_PATH: ${{ inputs.source_path }}
          LANGUAGE: ${{ inputs.language }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          STUDENT_ID: ${{ inputs.student_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/thebitlab-report"
          python - "$ACTIVITY_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          activity = json.loads((Path("student-work") / sys.argv[1]).read_text(encoding="utf-8"))
          if not activity.get("test_cases"):
              raise SystemExit(
                  "La preview richiede test pubblici espliciti nella copia studente della activity."
              )
          PY
          python thebitlab/scripts/grade_activity.py \
            --activity "student-work/$ACTIVITY_PATH" \
            --source "student-work/$SOURCE_PATH" \
            --language "$LANGUAGE" \
            --assignment-id "$ASSIGNMENT_ID" \
            --student-id "$STUDENT_ID" \
            --commit "${{ github.sha }}" \
            --docker \
            --report "$RUNNER_TEMP/thebitlab-report/report.json"

      - name: Upload grading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thebitlab-${{ inputs.activity_id }}-${{ inputs.language }}-report
          path: ${{ runner.temp }}/thebitlab-report/report.json
          if-no-files-found: error
