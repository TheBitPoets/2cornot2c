name: Publish assignment runner toolchain

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker/assignment-runner/**"
      - "scripts/build_assignment_runner.py"
      - "scripts/grade_activity.py"
      - "tests/test_student_lab_runner_docker.py"
      - ".github/workflows/publish-assignment-runner.yml"

concurrency:
  group: assignment-runner-toolchain
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build pinned runner
        run: >-
          python scripts/build_assignment_runner.py
          --source-revision "$GITHUB_SHA"
          --metadata "$RUNNER_TEMP/toolchain-build.json"

      - name: Install smoke test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Exercise isolated runner
        env:
          THEBITLAB_RUN_DOCKER_TESTS: "1"
        run: python -m pytest -q tests/test_student_lab_runner_docker.py

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build pinned runner
        run: >-
          python scripts/build_assignment_runner.py
          --source-revision "$GITHUB_SHA"
          --metadata "$RUNNER_TEMP/toolchain-build.json"

      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable version and commit tags
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json, os, pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "toolchain-build.json").read_text())["version"])')"
          IMAGE="ghcr.io/thebitpoets/2cornot2c-assignment-runner"
          VERSION_REF="${IMAGE}:${VERSION}"
          COMMIT_REF="${IMAGE}:sha-${GITHUB_SHA}"
          if docker manifest inspect "${VERSION_REF}" >/dev/null 2>&1; then
            echo "La versione ${VERSION} esiste gia: incrementa toolchain.json." >&2
            exit 1
          fi
          docker tag thebitlab-assignment-runner "${VERSION_REF}"
          docker tag thebitlab-assignment-runner "${COMMIT_REF}"
          PUSH_OUTPUT="$(docker push "${VERSION_REF}")"
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST="$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -n 1)"
          test -n "${DIGEST}"
          docker push "${COMMIT_REF}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Write release evidence
        env:
          TOOLCHAIN_VERSION: ${{ steps.publish.outputs.version }}
          TOOLCHAIN_IMAGE: ${{ steps.publish.outputs.image }}
          TOOLCHAIN_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata_path = Path(os.environ["RUNNER_TEMP"]) / "toolchain-build.json"
          payload = json.loads(metadata_path.read_text(encoding="utf-8"))
          payload["published_image"] = os.environ["TOOLCHAIN_IMAGE"]
          payload["published_digest"] = os.environ["TOOLCHAIN_DIGEST"]
          payload["immutable_reference"] = (
              f"{os.environ['TOOLCHAIN_IMAGE']}@{os.environ['TOOLCHAIN_DIGEST']}"
          )
          release_path = Path(os.environ["RUNNER_TEMP"]) / "toolchain-release.json"
          release_path.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assignment-runner-toolchain-${{ steps.publish.outputs.version }}
          path: ${{ runner.temp }}/toolchain-release.json
          if-no-files-found: error

      - name: Summarize immutable reference
        run: |
          {
            echo "## Assignment runner toolchain"
            echo
            echo "- Version: \`${{ steps.publish.outputs.version }}\`"
            echo "- Immutable reference: \`${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo
            echo "Use this digest in the reviewed toolchain lock PR. Do not use either mutable tag for grading."
          } >> "$GITHUB_STEP_SUMMARY"
