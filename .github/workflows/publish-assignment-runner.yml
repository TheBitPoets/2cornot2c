name: Publish assignment runner toolchain

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-assignment-runner.yml"
      - "docker/assignment-runner/**"
      - "scripts/build_assignment_runner.py"
      - "scripts/publish_assignment_runner.py"
      - "scripts/grade_activity.py"
      - "scripts/python_function_profile.py"
      - "scripts/python_function_worker.py"
      - "scripts/grade_python_function_activity.py"
      - "scripts/thebitlab_technical_services.py"
      - "scripts/validate_activity.py"
      - "scripts/create_submission_scaffold.py"
      - "scripts/student_lab_runner.py"
      - "tests/test_python_function_profile.py"
      - "tests/test_python_function_worker.py"
      - "tests/test_python_function_profile_dispatch.py"
      - "tests/test_python_function_student_lab_docker.py"
      - "tests/test_validate_activity_function_profile.py"
      - "tests/test_p2_release_candidate.py"

concurrency:
  group: assignment-runner-toolchain
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_id: ${{ steps.image-digest.outputs.image_id }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate P2 contracts, dispatch and release identity
        run: >-
          python -m pytest -q
          tests/test_build_assignment_runner.py
          tests/test_p2_release_candidate.py
          tests/test_python_function_profile.py
          tests/test_python_function_worker.py
          tests/test_python_function_profile_dispatch.py
          tests/test_validate_activity_function_profile.py

      - name: Build pinned runner
        run: >-
          python scripts/build_assignment_runner.py
          --source-revision "$GITHUB_SHA"
          --metadata "$RUNNER_TEMP/toolchain-build.json"

      - name: Export validated image digest
        id: image-digest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path(os.environ["RUNNER_TEMP"], "toolchain-build.json").read_text(encoding="utf-8")
          )
          print(f"image_id={metadata['local_image_id']}")
          PY

      - name: Stage validated runner toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/runner-toolchain"
          docker save thebitlab-assignment-runner \
            | gzip > "$RUNNER_TEMP/runner-toolchain/runner-image.tar.gz"
          cp "$RUNNER_TEMP/toolchain-build.json" \
            "$RUNNER_TEMP/runner-toolchain/toolchain-build.json"

      - name: Upload validated runner toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-toolchain
          path: ${{ runner.temp }}/runner-toolchain
          if-no-files-found: error

      - name: Exercise legacy Docker runner regressions
        env:
          THEBITLAB_RUN_DOCKER_TESTS: "1"
        run: python -m pytest -q tests/test_student_lab_runner_docker.py

      - name: Exercise P2 through normal Student Lab Docker dispatch
        env:
          THEBITLAB_RUN_DOCKER_TESTS: "1"
        run: python -m pytest -q tests/test_python_function_student_lab_docker.py

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download validated runner toolchain
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: runner-toolchain
          path: ${{ runner.temp }}/runner-toolchain

      - name: Load validated runner image and verify digest
        env:
          VALIDATED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
        run: |
          gunzip < "$RUNNER_TEMP/runner-toolchain/runner-image.tar.gz" | docker load
          loaded_id=$(docker image inspect --format '{{.Id}}' thebitlab-assignment-runner)
          if [ "$loaded_id" != "$VALIDATED_IMAGE_ID" ]; then
            echo "L'immagine caricata $loaded_id non corrisponde all'immagine validata $VALIDATED_IMAGE_ID"
            exit 1
          fi
          echo "Immagine validata caricata: $loaded_id"

      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable version and commit tags
        id: publish
        run: >-
          python scripts/publish_assignment_runner.py
          --metadata "$RUNNER_TEMP/runner-toolchain/toolchain-build.json"
          --release "$RUNNER_TEMP/toolchain-release.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assignment-runner-toolchain-${{ steps.publish.outputs.version }}
          path: ${{ runner.temp }}/toolchain-release.json
          if-no-files-found: error

      - name: Summarize immutable reference
        run: |
          {
            echo "## Assignment runner toolchain"
            echo
            echo "- Version: \`${{ steps.publish.outputs.version }}\`"
            echo "- Immutable reference: \`${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo
            echo "Use this digest in the reviewed toolchain lock PR. Do not use either mutable tag for grading."
          } >> "$GITHUB_STEP_SUMMARY"
