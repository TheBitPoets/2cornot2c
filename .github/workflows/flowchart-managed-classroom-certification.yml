name: Flowchart managed classroom certification

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/flowchart_lab_*.py"
      - "scripts/student_runtime.py"
      - "scripts/student_runtime_cli.py"
      - "scripts/student_lab_runner.py"
      - "scripts/student_lab_service.py"
      - "scripts/thebitlab_builtin_runtimes.py"
      - "scripts/thebitlab_runtime_*.py"
      - "tools/flowchart_lab/**"
      - "tests/test_student_runtime_cli.py"
      - "tests/test_flowchart_lab_runtime_plugin.py"
      - "tests/flowchart_managed_cli_rehearsal.py"
      - ".github/workflows/flowchart-managed-classroom-certification.yml"

jobs:
  managed-launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Course Environment candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate runtime registry and CLI lifecycle contracts
        run: >-
          python -m pytest -q
          tests/test_student_runtime_cli.py
          tests/test_flowchart_lab_runtime_plugin.py
          tests/test_flowchart_lab_server_hardening.py
          tests/test_flowchart_lab_workspace.py
          tests/test_flowchart_lab_workspace_api.py

      - name: Rehearse real managed Student Runtime CLI
        run: python tests/flowchart_managed_cli_rehearsal.py
