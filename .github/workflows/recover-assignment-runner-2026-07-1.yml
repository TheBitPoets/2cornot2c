name: Recover assignment runner 2026.07.1

on:
  push:
    branches:
      - agent/course-environment-contract
    paths:
      - ".github/workflows/recover-assignment-runner-2026-07-1.yml"

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  recover-exact-historical-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HISTORICAL_RUN_ID: "30176091732"
      HISTORICAL_ARTIFACT: "runner-toolchain"
      EXPECTED_VERSION: "2026.07.1"
      EXPECTED_SOURCE_REVISION: "bd102146a684a9b06835204ec1b7f668f7655a03"
      EXPECTED_IMAGE_ID: "sha256:6db07f57c95e50b359611818fc39f90c574d91dbdaa67e87f349391190222292"
      EXPECTED_MANIFEST_DIGEST: "sha256:62f0f7b7bc1d48d01b7f8e5fa765e0b43be3622e70a614033b1bb4a4e522e159"
      IMAGE_REPOSITORY: "ghcr.io/thebitpoets/2cornot2c-assignment-runner"
      VERSION_REFERENCE: "ghcr.io/thebitpoets/2cornot2c-assignment-runner:2026.07.1"
      COMMIT_REFERENCE: "ghcr.io/thebitpoets/2cornot2c-assignment-runner:sha-bd102146a684a9b06835204ec1b7f668f7655a03"
      IMMUTABLE_REFERENCE: "ghcr.io/thebitpoets/2cornot2c-assignment-runner@sha256:62f0f7b7bc1d48d01b7f8e5fa765e0b43be3622e70a614033b1bb4a4e522e159"
      STAGING_REFERENCE: "ghcr.io/thebitpoets/2cornot2c-assignment-runner:recovery-2026.07.1-bd102146"

    steps:
      - name: Download exact historical validated image artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: runner-toolchain
          path: ${{ runner.temp }}/runner-toolchain-recovery
          github-token: ${{ github.token }}
          repository: TheBitPoets/2cornot2c
          run-id: 30176091732

      - name: Verify historical build metadata before loading image
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "runner-toolchain-recovery"
          metadata = json.loads((root / "toolchain-build.json").read_text(encoding="utf-8"))
          expected = {
              "schema_version": "thebitlab.grading-toolchain-build.v1",
              "version": os.environ["EXPECTED_VERSION"],
              "platform": "linux/amd64",
              "image_repository": os.environ["IMAGE_REPOSITORY"],
              "worker_schema_version": "thebitlab.grading-worker.v1",
              "source_revision": os.environ["EXPECTED_SOURCE_REVISION"],
              "local_image_id": os.environ["EXPECTED_IMAGE_ID"],
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(
                      f"Historical metadata mismatch for {key}: {metadata.get(key)!r} != {value!r}"
                  )
          image_archive = root / "runner-image.tar.gz"
          if not image_archive.is_file() or image_archive.stat().st_size < 1_000_000:
              raise SystemExit("Historical validated runner archive is missing or implausibly small")
          print("Historical toolchain metadata matches the recorded release evidence.")
          PY

      - name: Load and verify exact validated image bytes
        shell: bash
        run: |
          gunzip < "$RUNNER_TEMP/runner-toolchain-recovery/runner-image.tar.gz" | docker load
          python - <<'PY'
          import json
          import os
          import subprocess

          payload = json.loads(
              subprocess.run(
                  ["docker", "image", "inspect", "thebitlab-assignment-runner"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )
          if len(payload) != 1:
              raise SystemExit("Expected exactly one loaded runner image")
          image = payload[0]
          if image.get("Id") != os.environ["EXPECTED_IMAGE_ID"]:
              raise SystemExit(
                  f"Loaded image ID {image.get('Id')} != historical {os.environ['EXPECTED_IMAGE_ID']}"
              )
          labels = (image.get("Config") or {}).get("Labels") or {}
          expected_labels = {
              "org.opencontainers.image.version": os.environ["EXPECTED_VERSION"],
              "org.opencontainers.image.revision": os.environ["EXPECTED_SOURCE_REVISION"],
              "io.thebitlab.grading.worker-schema": "thebitlab.grading-worker.v1",
          }
          for key, value in expected_labels.items():
              if labels.get(key) != value:
                  raise SystemExit(
                      f"Loaded image label mismatch for {key}: {labels.get(key)!r} != {value!r}"
                  )
          print(f"Exact validated image loaded: {image['Id']}")
          PY

      - name: Authenticate to GHCR
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Fail closed if an authoritative tag exists with different content
        shell: bash
        run: |
          check_reference() {
            local reference="$1"
            local output
            set +e
            output="$(docker pull "$reference" 2>&1)"
            local code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              REFERENCE="$reference" python - <<'PY'
          import json
          import os
          import subprocess

          reference = os.environ["REFERENCE"]
          expected = os.environ["IMMUTABLE_REFERENCE"]
          repo_digests = json.loads(
              subprocess.run(
                  ["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", reference],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
          )
          if expected not in repo_digests:
              raise SystemExit(
                  f"Refusing overwrite: {reference} exists but does not resolve to {expected}: {repo_digests}"
              )
          print(f"Existing authoritative tag already matches historical digest: {reference}")
          PY
              return 0
            fi
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -Eqi 'manifest unknown|no such manifest|not found'; then
              return 2
            fi
            echo "Cannot safely classify remote state for $reference; refusing recovery."
            return 1
          }

          version_state=0
          check_reference "$VERSION_REFERENCE" || version_state=$?
          if [ "$version_state" -eq 1 ]; then exit 1; fi
          commit_state=0
          check_reference "$COMMIT_REFERENCE" || commit_state=$?
          if [ "$commit_state" -eq 1 ]; then exit 1; fi

          echo "VERSION_STATE=$version_state" >> "$GITHUB_ENV"
          echo "COMMIT_STATE=$commit_state" >> "$GITHUB_ENV"

      - name: Stage exact image and verify recovered manifest digest
        if: env.VERSION_STATE == '2' || env.COMMIT_STATE == '2'
        shell: bash
        run: |
          docker tag thebitlab-assignment-runner "$STAGING_REFERENCE"
          docker push "$STAGING_REFERENCE"
          docker pull "$STAGING_REFERENCE"
          REFERENCE="$STAGING_REFERENCE" python - <<'PY'
          import json
          import os
          import subprocess

          reference = os.environ["REFERENCE"]
          expected = os.environ["IMMUTABLE_REFERENCE"]
          repo_digests = json.loads(
              subprocess.run(
                  ["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", reference],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
          )
          if expected not in repo_digests:
              raise SystemExit(
                  "Recovered historical bytes produced a different OCI manifest. "
                  f"Expected {expected}; observed {repo_digests}. Authoritative tags were not touched."
              )
          print(f"Staging digest exactly reproduces historical manifest: {expected}")
          PY

      - name: Restore missing authoritative tags from exact validated image
        if: env.VERSION_STATE == '2' || env.COMMIT_STATE == '2'
        shell: bash
        run: |
          if [ "$VERSION_STATE" -eq 2 ]; then
            docker tag thebitlab-assignment-runner "$VERSION_REFERENCE"
            docker push "$VERSION_REFERENCE"
          fi
          if [ "$COMMIT_STATE" -eq 2 ]; then
            docker tag thebitlab-assignment-runner "$COMMIT_REFERENCE"
            docker push "$COMMIT_REFERENCE"
          fi

      - name: Verify immutable historical reference is restored
        shell: bash
        run: |
          docker pull "$IMMUTABLE_REFERENCE"
          REFERENCE="$IMMUTABLE_REFERENCE" python - <<'PY'
          import json
          import os
          import subprocess

          reference = os.environ["REFERENCE"]
          repo_digests = json.loads(
              subprocess.run(
                  ["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", reference],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
          )
          if reference not in repo_digests:
              raise SystemExit(f"Immutable reference not restored exactly: {repo_digests}")
          print(f"PASS: exact historical grading runner restored: {reference}")
          PY
