name: One-shot Flowchart loopback DNS fix

on:
  push:
    branches: ["agent/course-environment-contract"]
    paths:
      - ".github/workflows/flowchart-loopback-dns-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/course-environment-contract
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply exact loopback bind patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server_path = Path("scripts/flowchart_lab_server.py")
          server = server_path.read_text(encoding="utf-8")

          old_import = "from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport ipaddress\n"
          new_import = "from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport ipaddress\nfrom socketserver import TCPServer\n"
          if server.count(old_import) != 1:
              raise SystemExit("unexpected flowchart server import shape")
          server = server.replace(old_import, new_import, 1)

          marker = "\ndef create_http_server(\n"
          if server.count(marker) != 1:
              raise SystemExit("unexpected create_http_server marker count")
          subclass = '''\n\nclass _LoopbackThreadingHTTPServer(ThreadingHTTPServer):\n    \"\"\"HTTP server that binds loopback without reverse-DNS/FQDN lookup.\n\n    ``HTTPServer.server_bind`` calls ``socket.getfqdn`` after the TCP bind.\n    Flowchart Lab never consumes that resolved name: its security boundary is\n    the explicit loopback bind plus request Host/Origin checks. Avoiding the\n    lookup keeps managed launch deterministic on classroom/macOS networks.\n    \"\"\"\n\n    def server_bind(self) -> None:\n        TCPServer.server_bind(self)\n        host, port = self.server_address[:2]\n        self.server_name = str(host)\n        self.server_port = int(port)\n'''
          server = server.replace(marker, subclass + marker, 1)

          old_ctor = "    server = ThreadingHTTPServer((host, port), make_handler(service))\n"
          new_ctor = "    server = _LoopbackThreadingHTTPServer((host, port), make_handler(service))\n"
          if server.count(old_ctor) != 1:
              raise SystemExit("unexpected Flowchart HTTP server constructor shape")
          server = server.replace(old_ctor, new_ctor, 1)
          server_path.write_text(server, encoding="utf-8")

          test_path = Path("tests/test_flowchart_lab_server_hardening.py")
          test = test_path.read_text(encoding="utf-8")
          old_test_import = "import json\nimport threading\n"
          new_test_import = "import json\nimport socket\nimport threading\n"
          if test.count(old_test_import) != 1:
              raise SystemExit("unexpected hardening test import shape")
          test = test.replace(old_test_import, new_test_import, 1)
          test_marker = "\ndef test_duplicate_json_keys_are_rejected() -> None:\n"
          if test.count(test_marker) != 1:
              raise SystemExit("unexpected hardening test marker count")
          regression = '''\n\ndef test_loopback_server_bind_never_requires_reverse_dns(monkeypatch) -> None:\n    def reject_reverse_dns(*args, **kwargs):\n        raise AssertionError(f\"reverse DNS must not run: {args!r} {kwargs!r}\")\n\n    monkeypatch.setattr(socket, \"getfqdn\", reject_reverse_dns)\n    server = api.create_http_server(port=0)\n    try:\n        assert server.server_address[0] == api.DEFAULT_HOST\n        assert server.server_name == api.DEFAULT_HOST\n        assert server.server_port == server.server_address[1]\n    finally:\n        server.server_close()\n'''
          test = test.replace(test_marker, regression + test_marker, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_flowchart_lab_server_hardening.py tests/test_flowchart_lab_runtime_plugin.py tests/test_student_runtime_cli.py

      - name: Commit exact fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- scripts/flowchart_lab_server.py tests/test_flowchart_lab_server_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/flowchart_lab_server.py tests/test_flowchart_lab_server_hardening.py
          git commit -m "Avoid reverse DNS in Flowchart loopback bind"
          git push origin HEAD:agent/course-environment-contract
