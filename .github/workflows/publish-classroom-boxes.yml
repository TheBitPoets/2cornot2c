name: Build and publish classroom Packer boxes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione SemVer della release, per esempio 1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: classroom-boxes-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versione non valida: usare SemVer numerica, per esempio 1.0.0." >&2
            exit 2
          fi

  virtualbox-amd64:
    needs: validate-release
    runs-on: [self-hosted, Windows, X64, classroom-packer]
    timeout-minutes: 120
    env:
      VAGRANT_HOME: ${{ runner.temp }}/2cornot2c-vagrant-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install checksum-locked Packer plugin
        working-directory: packer
        run: python install-locked-plugin.py --platform windows_amd64

      - name: Validate locked Packer toolchain and template
        working-directory: packer
        run: |
          packer init classroom.pkr.hcl
          python verify-toolchain.py
          packer fmt -check .
          packer validate classroom.pkr.hcl

      - name: Prepare VirtualBox source box
        shell: bash
        working-directory: packer
        run: ./ensure-source-box.sh virtualbox 202510.26.0

      - name: Build VirtualBox AMD64 box
        working-directory: packer
        run: packer build -only=classroom.vagrant.virtualbox-amd64 classroom.pkr.hcl

      - name: Acceptance test
        shell: bash
        run: ./packer/acceptance/test-box.sh virtualbox packer/output/virtualbox-amd64/package.box

      - name: Stage release asset
        shell: pwsh
        run: |
          $source = 'packer/output/virtualbox-amd64/package.box'
          if ((Get-Item -LiteralPath $source).Length -ge 2GB) {
            throw 'La box supera il limite GitHub Releases di 2 GiB.'
          }
          Copy-Item -LiteralPath $source 2cornot2c-windows-amd64-virtualbox.box

      - name: Upload verified box
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virtualbox-amd64
          path: 2cornot2c-windows-amd64-virtualbox.box
          if-no-files-found: error
          retention-days: 1

      - name: Remove isolated Vagrant home
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath $env:VAGRANT_HOME -Recurse -Force -ErrorAction SilentlyContinue

  vmware-arm64:
    needs: validate-release
    runs-on: [self-hosted, macOS, ARM64, classroom-packer]
    timeout-minutes: 120
    env:
      VAGRANT_HOME: ${{ runner.temp }}/2cornot2c-vagrant-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install checksum-locked Packer plugin
        working-directory: packer
        run: python3 install-locked-plugin.py --platform darwin_arm64

      - name: Install VMware plugin in isolated Vagrant home
        working-directory: packer
        run: python3 install-locked-vagrant-plugin.py

      - name: Validate locked Packer toolchain and template
        working-directory: packer
        run: |
          packer init classroom.pkr.hcl
          python3 verify-toolchain.py --require-vagrant-vmware
          packer fmt -check .
          packer validate classroom.pkr.hcl

      - name: Prepare VMware source box
        working-directory: packer
        run: ./ensure-source-box.sh vmware_desktop 202510.26.0

      - name: Build VMware ARM64 box
        working-directory: packer
        run: packer build -only=classroom.vagrant.vmware-arm64 classroom.pkr.hcl

      - name: Acceptance test
        run: ./packer/acceptance/test-box.sh vmware_desktop packer/output/vmware-arm64/package.box

      - name: Stage release asset
        run: |
          source_box="packer/output/vmware-arm64/package.box"
          if [ "$(stat -f %z "$source_box")" -ge 2147483648 ]; then
            echo "La box supera il limite GitHub Releases di 2 GiB." >&2
            exit 3
          fi
          cp "$source_box" 2cornot2c-macos-arm64-vmware.box

      - name: Upload verified box
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vmware-arm64
          path: 2cornot2c-macos-arm64-vmware.box
          if-no-files-found: error
          retention-days: 1

      - name: Remove isolated Vagrant home
        if: always()
        run: rm -rf -- "$VAGRANT_HOME"

  release:
    needs: [virtualbox-amd64, vmware-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified boxes
        uses: actions/download-artifact@fa0a91b85d5f404e444e00e005971372dc801d16 # v4
        with:
          name: vmware-arm64
          path: release

      - name: Download VirtualBox box
        uses: actions/download-artifact@fa0a91b85d5f404e444e00e005971372dc801d16 # v4
        with:
          name: virtualbox-amd64
          path: release

      - name: Generate immutable release manifest
        run: |
          python packer/create-release-manifest.py \
            --version "$RELEASE_VERSION" \
            --repository "${{ github.repository }}" \
            --vmware release/2cornot2c-macos-arm64-vmware.box \
            --virtualbox release/2cornot2c-windows-amd64-virtualbox.box \
            --output release/release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "classroom-v${RELEASE_VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Classroom VM ${RELEASE_VERSION}" \
            --notes "Box Packer collaudate per Windows AMD64 e macOS Apple Silicon." \
            release/release-manifest.json \
            release/2cornot2c-macos-arm64-vmware.box \
            release/2cornot2c-windows-amd64-virtualbox.box
