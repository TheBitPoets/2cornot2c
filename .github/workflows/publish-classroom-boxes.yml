name: Build and publish one classroom Packer box

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Piattaforma da costruire e pubblicare"
        required: true
        type: choice
        options:
          - windows-amd64-virtualbox
          - macos-arm64-vmware
      version:
        description: "Versione SemVer revisionata del target"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: classroom-box-${{ inputs.target }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate reviewed target and version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          from installer.classroom_release_lock import load_target_releases

          target = os.environ["RELEASE_TARGET"]
          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Versione non valida: usare SemVer numerica.")
          releases = load_target_releases(
              Path("packer/classroom-releases.lock.json")
          )
          entry = releases.get(target)
          if entry is None or entry.candidate_version != version:
              raise SystemExit("Target o versione non revisionati nel lock.")
          PY
          tag="classroom-${RELEASE_TARGET}-v${RELEASE_VERSION}"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" \
            >/dev/null 2>&1
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "Il tag $tag esiste già e non può essere riutilizzato." >&2
            exit 4
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "Impossibile attestare l'assenza del tag $tag." >&2
            exit 5
          fi

  virtualbox-amd64:
    if: inputs.target == 'windows-amd64-virtualbox'
    needs: validate-release
    runs-on: [self-hosted, Windows, X64, classroom-packer]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure isolated Vagrant home
        shell: powershell
        run: |
          $vagrantHome = Join-Path $env:RUNNER_TEMP `
            "2cornot2c-vagrant-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "VAGRANT_HOME=$vagrantHome" | Out-File -FilePath $env:GITHUB_ENV `
            -Encoding utf8 -Append
      - name: Install checksum-locked Packer plugin
        working-directory: packer
        run: python install-locked-plugin.py --platform windows_amd64
      - name: Validate locked Packer toolchain and template
        working-directory: packer
        run: |
          packer init classroom.pkr.hcl
          python verify-toolchain.py
          packer fmt -check .
          packer validate classroom.pkr.hcl
      - name: Prepare VirtualBox source box
        shell: bash
        working-directory: packer
        run: ./ensure-source-box.sh virtualbox 202510.26.0
      - name: Build VirtualBox AMD64 box
        working-directory: packer
        run: packer build '-only=classroom.vagrant.virtualbox-amd64' classroom.pkr.hcl
      - name: Acceptance test
        shell: bash
        run: ./packer/acceptance/test-box.sh virtualbox packer/output/virtualbox-amd64/package.box
      - name: Stage release asset
        shell: powershell
        run: |
          $source = 'packer/output/virtualbox-amd64/package.box'
          if ((Get-Item -LiteralPath $source).Length -ge 2GB) {
            throw 'La box supera il limite GitHub Releases di 2 GiB.'
          }
          Copy-Item -LiteralPath $source 2cornot2c-windows-amd64-virtualbox.box
      - name: Upload verified box
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-amd64-virtualbox-${{ inputs.version }}
          path: 2cornot2c-windows-amd64-virtualbox.box
          if-no-files-found: error
          retention-days: 1
      - name: Remove isolated Vagrant home
        if: always()
        shell: powershell
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP `
            "2cornot2c-vagrant-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $separator = [IO.Path]::DirectorySeparatorChar
          $expectedParent = [IO.Path]::GetFullPath(
            $env:RUNNER_TEMP
          ).TrimEnd($separator)
          $actualParent = [IO.Path]::GetFullPath(
            (Split-Path -Parent $isolated)
          ).TrimEnd($separator)
          if ($actualParent -ne $expectedParent) {
            throw 'Percorso VAGRANT_HOME isolato non valido.'
          }
          Remove-Item -LiteralPath $isolated -Recurse -Force `
            -ErrorAction SilentlyContinue

  vmware-arm64:
    if: inputs.target == 'macos-arm64-vmware'
    needs: validate-release
    runs-on: [self-hosted, macOS, ARM64, classroom-packer]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure isolated Vagrant home
        run: |
          printf 'VAGRANT_HOME=%s/2cornot2c-vagrant-%s-%s\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install checksum-locked Packer plugin
        working-directory: packer
        run: python3 install-locked-plugin.py --platform darwin_arm64
      - name: Install VMware plugin in isolated Vagrant home
        working-directory: packer
        run: python3 install-locked-vagrant-plugin.py
      - name: Validate locked Packer toolchain and template
        working-directory: packer
        run: |
          packer init classroom.pkr.hcl
          python3 verify-toolchain.py --require-vagrant-vmware
          packer fmt -check .
          packer validate classroom.pkr.hcl
      - name: Prepare VMware source box
        working-directory: packer
        run: ./ensure-source-box.sh vmware_desktop 202510.26.0
      - name: Build VMware ARM64 box
        working-directory: packer
        run: packer build -only=classroom.vagrant.vmware-arm64 classroom.pkr.hcl
      - name: Acceptance test
        run: ./packer/acceptance/test-box.sh vmware_desktop packer/output/vmware-arm64/package.box
      - name: Stage release asset
        run: |
          source_box="packer/output/vmware-arm64/package.box"
          if [ "$(stat -f %z "$source_box")" -ge 2147483648 ]; then
            echo "La box supera il limite GitHub Releases di 2 GiB." >&2
            exit 3
          fi
          cp "$source_box" 2cornot2c-macos-arm64-vmware.box
      - name: Upload verified box
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-vmware-${{ inputs.version }}
          path: 2cornot2c-macos-arm64-vmware.box
          if-no-files-found: error
          retention-days: 1
      - name: Remove isolated Vagrant home
        if: always()
        run: |
          isolated="$RUNNER_TEMP/2cornot2c-vagrant-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          case "$isolated" in
            "$RUNNER_TEMP"/2cornot2c-vagrant-*) rm -rf -- "$isolated" ;;
            *) echo "Percorso VAGRANT_HOME isolato non valido." >&2; exit 6 ;;
          esac

  release-windows:
    needs: virtualbox-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified box
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-amd64-virtualbox-${{ inputs.version }}
          path: release
      - name: Generate immutable target manifest
        run: |
          python packer/create-release-manifest.py \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --target windows-amd64-virtualbox \
            --box release/2cornot2c-windows-amd64-virtualbox.box \
            --output release/release-manifest.json
          sha256sum release/release-manifest.json
      - name: Publish target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "classroom-windows-amd64-virtualbox-v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Classroom Windows AMD64 / VirtualBox ${RELEASE_VERSION}" \
            --notes "Box Packer Windows AMD64 / VirtualBox collaudata fisicamente." \
            release/release-manifest.json \
            release/2cornot2c-windows-amd64-virtualbox.box

  release-macos:
    needs: vmware-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified box
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-vmware-${{ inputs.version }}
          path: release
      - name: Generate immutable target manifest
        run: |
          python packer/create-release-manifest.py \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --target macos-arm64-vmware \
            --box release/2cornot2c-macos-arm64-vmware.box \
            --output release/release-manifest.json
          sha256sum release/release-manifest.json
      - name: Publish target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "classroom-macos-arm64-vmware-v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Classroom macOS ARM64 / VMware ${RELEASE_VERSION}" \
            --notes "Box Packer macOS ARM64 / VMware collaudata fisicamente." \
            release/release-manifest.json \
            release/2cornot2c-macos-arm64-vmware.box
