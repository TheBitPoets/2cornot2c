name: Quality

permissions:
  contents: read

env:
  SECURITY_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  SECURITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "deploy/**"
      - "tests/**"
      - "activities/**"
      - "doc/**"
      - "README.md"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "requirements-utui.txt"
      - "requirements-auth.txt"
      - "requirements-docs.txt"
      - ".github/workflows/quality.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "schemas/**"
      - "deploy/**"
      - "tests/**"
      - "activities/**"
      - "doc/**"
      - "README.md"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "requirements-utui.txt"
      - "requirements-auth.txt"
      - "requirements-docs.txt"
      - ".github/workflows/quality.yml"

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      THEBITLAB_REQUIRE_UTUI: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-utui.txt -r requirements-auth.txt

      - name: Install deployment lint tools
        run: sudo apt-get update && sudo apt-get install -y nginx logrotate openssl acl systemd python3-jsonschema

      - name: Run Python tests
        run: python -m pytest

      - name: Check generated course plan
        run: python scripts/generate_course_plan.py --check

      - name: Build Sphinx documentation
        run: |
          python -m pip install -r requirements-docs.txt
          python -m sphinx -W --keep-going -c doc/sphinx doc/sphinx doc/sphinx/_build/html

  security-evidence:
    name: security-evidence-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A
            mode: --bootstrap-adversarial-only
          - shard: BE
            mode: --private-runtime-gate-only
          - shard: C
            mode: --fence-race-only
          - shard: DF
            mode: ""
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SECURITY_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Bind candidate and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SECURITY_CANDIDATE_SHA"
          test "$(git merge-base "$SECURITY_CANDIDATE_SHA" "$SECURITY_BASE_SHA")" = "$SECURITY_BASE_SHA"
          printf 'candidate=%s\nbase=%s\n' "$SECURITY_CANDIDATE_SHA" "$SECURITY_BASE_SHA"

      - name: Run authentic security shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SECURITY_CANDIDATE_SHA"
          export THEBITLAB_SECURITY_BASE_SHA="$SECURITY_BASE_SHA"
          export GITHUB_RUN_ID="${{ github.run_id }}-${{ matrix.shard }}"
          scripts/run_pilot_ubuntu_integration_container.sh ${{ matrix.mode }} \
            | tee "security-${{ matrix.shard }}.log"

      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence-${{ matrix.shard }}
          path: security-${{ matrix.shard }}.log
          if-no-files-found: error
          retention-days: 7

  security-aggregate:
    name: security-evidence-aggregate
    runs-on: ubuntu-24.04
    needs: security-evidence
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SECURITY_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Download authentic shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: security-evidence-*
          path: security-evidence
          merge-multiple: true

      - name: Aggregate exact-head A-F security evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SECURITY_CANDIDATE_SHA"
          mapfile -t logs < <(find security-evidence -maxdepth 1 -type f -name 'security-*.log' -print | sort)
          test "${#logs[@]}" -eq 4
          python -m scripts.pilot_private_runtime_evidence \
            --candidate-sha "$SECURITY_CANDIDATE_SHA" \
            --base-sha "$SECURITY_BASE_SHA" \
            --authority-manifest deploy/pilot/ci/security-evidence-authority.json \
            "${logs[@]}"

  mermaid-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-mermaid-cli-${{ hashFiles('doc/architecture/diagrams/.mmd-version') }}
          restore-keys: |
            ${{ runner.os }}-mermaid-cli-

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('doc/architecture/diagrams/.mmd-version') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Smoke-test architecture diagrams rendering
        run: |
          set -euo pipefail
          bash scripts/render_architecture_diagrams.sh
          # Verifica che ogni .mmd abbia prodotto un .svg non vuoto.
          for src in doc/architecture/diagrams/*.mmd; do
            name="$(basename "${src}" .mmd)"
            svg="doc/architecture/diagrams/${name}.svg"
            if [ ! -s "${svg}" ]; then
              echo "ERRORE: ${svg} mancante o vuoto." >&2
              exit 1
            fi
          done
          echo "Tutti i diagrammi sono renderizzabili e hanno un SVG corrispondente."

  windows-filesystem:
    runs-on: windows-latest
    env:
      THEBITLAB_REQUIRE_UTUI: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-utui.txt -r requirements-auth.txt

      - name: Validate Windows lifecycle scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/*classroom-windows.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Message) in $($_.Extent.File)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Test storage, lab and deletion workflows
        run: >-
          python -m pytest
          tests/test_assignment_records.py
          tests/test_student_help_service.py
          tests/test_student_help_codex_adapter.py
          tests/test_student_lab_service.py
          tests/test_student_lab_cli.py
          tests/test_student_lab_utui.py
          tests/test_student_lab_demo_setup.py
          tests/test_track_assignments.py
          tests/test_course_board_server.py
          tests/test_thebitlab_google_oidc.py
          tests/test_thebitlab_github_oauth.py
          tests/test_thebitlab_github_team_mapping.py

      - name: Test portable Node.js and SQL runners
        run: >-
          python -m pytest
          tests/test_grade_activity.py
          tests/test_student_lab_runner.py
          -k "javascript or node or sql"

  minimum-python:
    runs-on: ubuntu-latest
    env:
      THEBITLAB_REQUIRE_UTUI: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SECURITY_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up minimum supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-utui.txt -r requirements-auth.txt

      - name: Test full suite on minimum Python
        run: python -m pytest
